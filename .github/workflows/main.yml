name: Laravel CI/CD

on:
  push:
    branches: [ main ]  # Ejecuta en commits a main
  pull_request:
    branches: [ main ]  # También en PRs hacia main

concurrency:
  group: ci-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar repositorio (para entorno de GitHub Actions)
      - name: Clonar repositorio
        uses: actions/checkout@v3

      # 2️⃣ Conectar al servidor y actualizar la API
      - name: Actualizar API Laravel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/api-ecommerce.juandevops.com/public_html
      
            # Configurar Git con el token
            git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      
            # Obtener últimos cambios
            git pull origin main
      
            # Instalar dependencias
            composer install --no-dev --optimize-autoloader
      
            # Ajustar permisos del directorio storage
            sudo chown -R www-data: storage
            sudo chmod -R 777 storage
      
            # Limpiar cachés de Laravel
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
      
            # Reiniciar servidor web si es necesario
            sudo systemctl restart lsws    
