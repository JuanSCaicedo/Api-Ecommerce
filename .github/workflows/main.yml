name: Laravel CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar repositorio (para entorno de GitHub Actions)
      - name: Clonar repositorio
        uses: actions/checkout@v3

      # 2️⃣ Conectar al servidor y actualizar la API
      - name: Actualizar API Laravel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navegar al proyecto
            cd /home/api-ecommerce.juandevops.com/public_html

            # 👉 Ejecutar git pull usando la clave SSH correcta
            sudo GIT_SSH_COMMAND="ssh -i /github-ssh/github-ssh" git pull origin main

            # Instalar dependencias
            composer update

            # Ajustar permisos del directorio storage
            sudo chown -R www-data: storage
            sudo chmod -R 777 storage

            # Limpiar cachés de Laravel
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Reiniciar servidor web
            sudo systemctl restart lsws