name: Laravel CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 🔑 Clonar el repositorio correctamente
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 📂 Conectar al servidor y actualizar la API
      - name: Actualizar API Laravel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navegar al proyecto
            cd /home/api-ecommerce.juandevops.com/public_html

            # ✅ Verificar y ajustar permisos del archivo SSH
            sudo chmod 600 /github-ssh/github-ssh

            # ✅ Corregir permisos del repositorio
            sudo chown -R $USER:$USER .git

            # 👉 Ejecutar git pull usando la clave SSH correcta
            GIT_SSH_COMMAND="ssh -i /github-ssh/github-ssh" git pull origin main

            # 📦 Instalar dependencias
            composer install --no-interaction --prefer-dist --optimize-autoloader

            # ✅ Ajustar permisos del directorio storage y cache
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            # ✅ Ajustar permisos del archivo de logs
            sudo touch storage/logs/laravel.log
            sudo chown -R www-data:www-data storage/logs
            sudo chmod -R 775 storage/logs

            # 🔄 Limpiar cachés de Laravel
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # ♻️ Reiniciar servidor web (LiteSpeed)
            sudo systemctl restart lsws