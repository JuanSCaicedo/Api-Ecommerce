name: Laravel CI/CD

on:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
      - name: Probar conexión SSH al servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "✅ Conexión SSH exitosa"
            hostname
            whoami
            pwd