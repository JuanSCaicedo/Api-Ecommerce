name: Laravel CI/CD

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy Laravel vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            PROJECT_PATH="/home/api-ecommerce.juandevops.com/public_html"

            echo "▶ Entrando al proyecto"
            cd $PROJECT_PATH

            echo "▶ Asegurando SSH con GitHub"
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts

            echo "▶ Usando repositorio por SSH"
            git remote set-url origin git@github.com:JuanSCaicedo/Api-Ecommerce.git

            echo "▶ Reset y pull limpio"
            git reset --hard HEAD
            git pull origin main

            echo "▶ Instalando dependencias (producción)"
            composer install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction

            echo "▶ Permisos correctos"
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            echo "▶ Limpiando caché"
            php artisan optimize:clear

            echo "▶ Regenerando caché segura"
            php artisan config:cache
            php artisan view:cache
            # route:cache SOLO si no usas closures
            php artisan route:cache || echo "⚠ Route cache omitido"

            echo "▶ Reiniciando servidor web"
            sudo systemctl restart lsws

            echo "✅ Deploy completado correctamente"